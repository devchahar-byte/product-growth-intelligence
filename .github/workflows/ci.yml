name: CI & Technical Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate SQL, Python & Metric Test Suite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r python/scripts/requirements.txt
          pip install sqlfluff pyflakes

      - name: Lint SQL files with sqlfluff
        run: |
          sqlfluff lint sql/ --dialect bigquery

      - name: Compile and validate Python syntax
        run: |
          python -m py_compile python/scripts/stats_helpers.py
          python -m py_compile python/notebooks/01_eda_and_validation.py
          python -m py_compile app.py
          python -m py_compile run_tool.py
          echo "All Python scripts compiled successfully."

      - name: Run statistical and metric unit test suite
        run: |
          python -m unittest discover -s python/tests -v

      - name: Verify repository structure and documentation integrity
        run: |
          required_files=(
            "README.md"
            "LICENSE"
            ".sqlfluff"
            "sql/01_schema_exploration/01_explore_schema.sql"
            "sql/02_user_session_layer/02_user_session_summary.sql"
            "sql/03_funnel_analysis/03_conversion_funnel.sql"
            "sql/04_channel_analysis/04_channel_conversion.sql"
            "sql/05_product_revenue/05_product_analysis.sql"
            "sql/06_segment_analysis/06_segment_analysis.sql"
            "sql/07_data_quality/07_data_quality_checks.sql"
            "python/notebooks/01_eda_and_validation.py"
            "python/scripts/stats_helpers.py"
            "python/scripts/requirements.txt"
            "python/tests/test_stats_helpers.py"
            "python/tests/test_metric_calculations.py"
            "reports/product_growth_report.md"
            "reports/experiment_proposal.md"
            "powerbi/schema/powerbi_schema.md"
            "docs/metric_definitions.md"
          )
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            else
              echo "OK: $f"
            fi
          done
          echo "All required files verified present."
